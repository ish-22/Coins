<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C95C"/>
      <stop offset="50%" stop-color="#F0B93A"/>
      <stop offset="100%" stop-color="#D89C1D"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E2B"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Hexagon Mark -->
  <g transform="translate(4, 2)">
    <!-- Hexagon Outer Outline -->
    <polygon points="20,0 38,10.4 38,31.6 20,42 2,31.6 2,10.4" fill="url(#innerGrad)" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Internal facet accents -->
    <polygon points="20,4 34,12 34,30 20,38 6,30 6,12" fill="none" stroke="#243042" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- Stylized 'C' lettermark -->
    <path d="M19 14 H13 C11.34 14 10 15.34 10 17 V25 C10 26.66 11.34 28 13 28 H19" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stylized '+' Cross -->
    <path d="M23 21 H30 M26.5 17.5 V24.5" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Central Gold Node -->
    <circle cx="20" cy="21" r="1.2" fill="#F0B93A"/>
  </g>

  <!-- Wordmark "CoinPlus" -->
  <text x="56" y="28" font-family="'Inter', sans-serif" font-weight="800" font-size="21" fill="#F4F6FA" letter-spacing="-0.03em">
    COIN<tspan fill="#F0B93A">PLUS</tspan>
  </text>
  
  <!-- Subtitle Tag -->
  <text x="56" y="38" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" fill="#98A5B7" letter-spacing="0.18em">
    CRYPTO EXCHANGE
  </text>
</svg>
